    const Y = (v) => mT + (spec.yMax - v) / (spec.yMax - spec.yMin) * plotH;
    const xtY = h - 34;
    const hg = spec.yTicks.map((t) => ({ y: this.r1(Y(t)), ly: this.r1(Y(t) - 7), text: spec.yFmt(t), line: t > spec.yMin }));
    const vg = spec.xTicks.map((t) => ({ x: this.r1(X(t)), text: spec.xFmt(t), line: t > spec.xMin }));
    let hp = null;
    const pts = spec.pts.map((p, i) => {
      const k = key + ':' + i, isH = hov === k, cx = X(p.x), cy = Y(p.y), sz = isH ? 16 : 12;
      const left = cx > w - 150, dim = any && !isH;
      const o = { left: this.r1(cx - sz / 2), top: this.r1(cy - sz / 2), sz: sz, op: dim ? 0.18 : 1, c: this.acc,
        ring: isH ? '2px solid #FFFFFF' : '0', shadow: isH ? '0 0 0 1px ' + this.acc : 'none', lop: dim ? 0.45 : 1,
        label: p.label, lx: this.r1(left ? cx - 12 : cx + 12), ly: this.r1(cy - 8), ltf: left ? 'translateX(-100%)' : 'none',
        aria: p.tip.title + ': ' + p.tip.lines.map((l) => l.k + ' ' + l.v).join(', '),
        enter: () => this.setHov(k), leave: this.clearHov };
      if (isH) hp = { cx: cx, cy: cy, p: p };
      return o;
    });
    const ry = Y(spec.ref.v);
    const out = { w: w, h: h, mR: mR, mL: mL, mT: mT, plotW: this.r1(plotW), plotH: this.r1(plotH), yLabR: this.r1(w - mL + 8),
      axisY: this.r1(mT + plotH), hg: hg, vg: vg, xtY: xtY, xUnitY: h - 18, unitY: mT - 20, pts: pts,
      ref: { y: this.r1(ry), x: mL, len: this.r1(plotW), label: spec.ref.label, ly: this.r1(ry - 17) },
      unit: spec.yUnit, xUnit: spec.xUnit, tip: null };
    if (hp) out.tip = this.tip(hp.cx, hp.cy, w, hp.p.tip);
    return out;
  }

  spark(vals) {
    const mn = Math.min(...vals), mx = Math.max(...vals), n = vals.length;
    const X = (i) => 2 + i / (n - 1) * 96, Y = (v) => 28 - (v - mn) / (mx - mn) * 22;
    const pts = vals.map((v, i) => this.r1(X(i)) + ' ' + this.r1(Y(v)));
    return { d: 'M' + pts.join(' L'), area: 'M' + pts.join(' L') + ' L98 32 L2 32 Z', dx: this.r1(X(n - 1)), dy: this.r1(Y(vals[n - 1]) / 32 * 100) };
  }

  table(cols, rows) {
    return { gtc: 'minmax(132px, 2fr) repeat(' + (cols.length - 1) + ', minmax(76px, 1fr))',
      head: cols.map((c, i) => ({ t: c, al: i ? 'right' : 'left' })),
      rows: rows.map((r) => ({ cells: r.map((c, i) => ({ t: c, al: i ? 'right' : 'left' })) })) };
  }

  frame(key, built, table) {
    const on = !!this.state.tables[key];
    return Object.assign({}, built, { tableOn: on, chartOn: !on, toggleLabel: on ? 'Show chart' : 'Show table',
      toggle: () => this.setState((s) => ({ tables: Object.assign({}, s.tables, { [key]: !s.tables[key] }), hov: null })), tbl: table });
  }

  renderVals() {
    const D = this.D, C = this.C, st = this.state;
    this.acc = this.props.accent ?? '#1B66C4';
    const acc = this.acc;
    const show = this.props.showCharts ?? true;
    const w = Math.max(260, (st.cw || 722) - 42);
    const T = D.total, TM = T.p / T.s;
    const m = (v, dp) => this.money(v, dp), p = (v, dp) => this.pct(v, dp);
    const sw = (c) => c;

    /* 1 Growth */
    const Y = D.years, s0 = Y[0].s, p0 = Y[0].p;
    const growth = this.frame('growth', this.line('growth', {
      xs: Y.map((y) => String(y.y)), min: 50, max: 250, ticks: [50, 100, 150, 200, 250], axFmt: (t) => String(t), unit: 'Index, 2012 = 100',
      series: [
        { c: acc, vals: Y.map((y) => y.s / s0 * 100), end: 'Sales +' + p(Y[3].s / s0 - 1) },
        { c: C.pink, vals: Y.map((y) => y.p / p0 * 100), end: 'Profit +' + p(Y[3].p / p0 - 1) }],
      tips: Y.map((y) => ({ title: String(y.y), lines: [
        { k: 'Sales', v: m(y.s) + '  (' + Math.round(y.s / s0 * 100) + ')', c: acc },
        { k: 'Profit', v: m(y.p) + '  (' + Math.round(y.p / p0 * 100) + ')', c: C.pink },
        { k: 'Margin', v: p(y.p / y.s) }] }))
    }, w), this.table(['Year', 'Sales', 'Profit', 'Margin', 'Sales index', 'Profit index'],
      Y.map((y) => [String(y.y), m(y.s), m(y.p), p(y.p / y.s), String(Math.round(y.s / s0 * 100)), String(Math.round(y.p / p0 * 100))])));

    /* 2 Markets */
    const mk = D.markets.slice().sort((a, b) => b.s - a.s);
    const mtip = (r) => ({ title: r.l, lines: [{ k: 'Sales', v: m(r.s) }, { k: 'Profit', v: m(r.p) }, { k: 'Margin', v: p(r.p / r.s) }, { k: 'Share of sales', v: p(r.s / T.s) }] });
    const markets = this.frame('markets', this.scatter('markets', {
      xMin: 0, xMax: 5e6, xTicks: [0, 1e6, 2e6, 3e6, 4e6, 5e6], xFmt: (t) => this.axMoney(t), xUnit: 'Sales',
      yMin: 0, yMax: 0.16, yTicks: [0, 0.04, 0.08, 0.12, 0.16], yFmt: (t) => this.axPct(t), yUnit: 'Profit margin',
      ref: { v: TM, label: 'Company ' + p(TM) },
      pts: mk.map((r) => ({ label: r.l, x: r.s, y: r.p / r.s, tip: mtip(r) }))
    }, w), this.table(['Market', 'Sales', 'Profit', 'Margin', 'Share of sales'], mk.map((r) => [r.l, m(r.s), m(r.p), p(r.p / r.s), p(r.s / T.s)])));

    /* 3 Regions */
    const rg = D.regions.slice().sort((a, b) => b.p / b.s - a.p / a.s);
    const rgOpen = !!st.open.regions;
    const toggleRg = () => this.setState((s) => ({ open: Object.assign({}, s.open, { regions: !s.open.regions }), hov: null }));
    const rrow = (r) => ({ label: r.l, v: r.p / r.s, tip: { title: r.l, lines: [{ k: 'Margin', v: p(r.p / r.s) }, { k: 'Sales', v: m(r.s) }, { k: 'Profit', v: m(r.p) }] } });
    const rgRows = rgOpen ? rg.map(rrow) : rg.slice(0, 6).map(rrow).concat([{ gap: true, text: 'Show ' + (rg.length - 12) + ' more regions', toggle: toggleRg }], rg.slice(-6).map(rrow));
    const regions = this.frame('regions', this.hbar('regions', {
      rows: rgRows, min: -0.4, max: 0.3, ticks: [-0.4, -0.2, 0, 0.2], fmt: (v) => p(v), axFmt: (v) => this.axPct(v), color: acc,
      ref: { v: TM, label: 'Company ' + p(TM) }, more: rgOpen ? { text: 'Show fewer regions', toggle: toggleRg } : null
    }, w), this.table(['Region', 'Margin', 'Sales', 'Profit'], rg.map((r) => [r.l, p(r.p / r.s), m(r.s), m(r.p)])));

    /* 4 Category / sub-category */
    const cats = {};
    D.subcats.forEach((r) => { const c = cats[r.c] || (cats[r.c] = { l: r.c, s: 0, p: 0, items: [] }); c.s += r.s; c.p += r.p; c.items.push(r); });
    const catList = Object.values(cats).sort((a, b) => b.p - a.p);
    const scRows = [];
    catList.forEach((c) => {
      scRows.push({ header: true, label: c.l, note: m(c.s) + ' sales, ' + p(c.p / c.s) + ' margin' });
      c.items.sort((a, b) => b.p - a.p).forEach((r) => scRows.push({ label: r.l, v: r.p,
        tip: { title: r.l + ' (' + c.l + ')', lines: [{ k: 'Profit', v: m(r.p) }, { k: 'Sales', v: m(r.s) }, { k: 'Margin', v: p(r.p / r.s) }, { k: 'Units', v: r.q.toLocaleString('en-US') }] } }));
    });
    const subcats = this.frame('subcats', this.hbar('subcats', {
      rows: scRows, min: -100000, max: 300000, ticks: [-100000, 0, 100000, 200000, 300000], fmt: (v) => m(v), axFmt: (v) => this.axMoney(v), color: acc
    }, w), this.table(['Sub-category', 'Category', 'Sales', 'Profit', 'Margin'],
      catList.flatMap((c) => c.items.map((r) => [r.l, c.l, m(r.s), m(r.p), p(r.p / r.s)]))));

    /* 5 Discount bands */
    const bands = this.frame('bands', this.col('bands', {
      min: -1.2, max: 0.4, ticks: [-1.2, -0.8, -0.4, 0, 0.4], axFmt: (t) => this.axPct(t), fmt: (v) => p(v), unit: 'Profit margin',
      cats: D.bands.map((b) => ({ label: b.l, v: b.p / b.s, sub: p(b.s / T.s) + ' of sales', subShort: p(b.s / T.s, 0),
        tip: { title: 'Discount ' + b.l, lines: [{ k: 'Margin', v: p(b.p / b.s) }, { k: 'Sales', v: m(b.s) }, { k: 'Profit', v: m(b.p) }, { k: 'Share of sales', v: p(b.s / T.s) }] } }))
    }, w), this.table(['Discount', 'Sales', 'Share of sales', 'Profit', 'Margin'], D.bands.map((b) => [b.l, m(b.s), p(b.s / T.s), m(b.p), p(b.p / b.s)])));

    /* 6 Segments */
    const sg = D.segments.slice().sort((a, b) => b.s - a.s);
    const segments = this.frame('segments', this.sm('segments', {
      rows: sg.map((r) => ({ label: r.l, tip: { title: r.l, lines: [{ k: 'Share of sales', v: p(r.s / T.s) }, { k: 'Margin', v: p(r.p / r.s) }, { k: 'Sales', v: m(r.s) }, { k: 'Profit', v: m(r.p) }] } })),
      panels: [
        { title: 'Share of sales', vals: sg.map((r) => r.s / T.s), min: 0, max: 0.6, fmt: (v) => p(v) },
        { title: 'Profit margin', vals: sg.map((r) => r.p / r.s), min: 0, max: 0.15, fmt: (v) => p(v) }]
    }, w), this.table(['Segment', 'Sales', 'Share of sales', 'Profit', 'Margin'], sg.map((r) => [r.l, m(r.s), p(r.s / T.s), m(r.p), p(r.p / r.s)])));

    /* 7 Ship mode */
    const shOrder = ['Standard Class', 'Second Class', 'First Class', 'Same Day'];
    const sh = shOrder.map((l) => D.ship.find((r) => r.l === l));
    const ship = this.frame('ship', this.sm('ship', {
      rows: sh.map((r) => ({ label: r.l, tip: { title: r.l, lines: [{ k: 'Share of sales', v: p(r.s / T.s) }, { k: 'Shipping cost per line', v: '$' + r.c.toFixed(2) }, { k: 'Days to ship', v: r.d.toFixed(2) }, { k: 'Margin', v: p(r.p / r.s) }] } })),
      panels: [
        { title: 'Share of sales', vals: sh.map((r) => r.s / T.s), min: 0, max: 0.7, fmt: (v) => p(v) },
        { title: 'Shipping cost per line', vals: sh.map((r) => r.c), min: 0, max: 50, fmt: (v) => '$' + v.toFixed(2) },
        { title: 'Days to ship', vals: sh.map((r) => r.d), min: 0, max: 6, fmt: (v) => v.toFixed(2) },
        { title: 'Profit margin', vals: sh.map((r) => r.p / r.s), min: 0, max: 0.15, fmt: (v) => p(v) }]
    }, w), this.table(['Ship mode', 'Share of sales', 'Cost per line', 'Days to ship', 'Margin'], sh.map((r) => [r.l, p(r.s / T.s), '$' + r.c.toFixed(2), r.d.toFixed(2), p(r.p / r.s)])));

    /* 8 Customers */
    const cu = D.customers;
    const customers = this.frame('customers', this.sm('customers', {
      rows: cu.map((r, i) => ({ label: r.l, tip: { title: r.l + ' (#' + (i + 1) + ' by sales)', lines: [{ k: 'Sales', v: m(r.s) }, { k: 'Profit', v: m(r.p) }, { k: 'Margin', v: p(r.p / r.s) }] } })),
      panels: [
        { title: 'Sales', vals: cu.map((r) => r.s), min: 0, max: 25000, fmt: (v) => m(v) },
        { title: 'Profit', vals: cu.map((r) => r.p), min: -3000, max: 10000, fmt: (v) => m(v) }]
    }, w), this.table(['Customer', 'Sales', 'Profit', 'Margin'], cu.map((r) => [r.l, m(r.s), m(r.p), p(r.p / r.s)])));

    /* 9 Products */
    const pr = D.products;
    const prow = (r) => ({ label: r.l, v: r.p, tip: { title: r.l, lines: [{ k: 'Profit', v: m(r.p) }, { k: 'Sales', v: m(r.s) }, { k: 'Margin', v: p(r.p / r.s) }, { k: 'Category', v: r.c }] } });
    const products = this.frame('products', this.hbar('products', {
      rows: [{ header: true, label: 'Most profitable', note: '' }].concat(pr.slice(0, 5).map(prow), [{ header: true, label: 'Least profitable', note: '' }], pr.slice(5).map(prow)),
      min: -10000, max: 30000, ticks: [-10000, 0, 10000, 20000, 30000], fmt: (v) => m(v), axFmt: (v) => this.axMoney(v), color: acc
    }, w), this.table(['Product', 'Category', 'Sales', 'Profit', 'Margin'], pr.map((r) => [r.l, r.c, m(r.s), m(r.p), p(r.p / r.s)])));

    const kpi = {
      sales: this.spark(Y.map((y) => y.s)), profit: this.spark(Y.map((y) => y.p)),
      orders: this.spark(Y.map((y) => y.o)), units: this.spark(Y.map((y) => y.u))
    };
    return { c: { growth, markets, regions, subcats, bands, segments, ship, customers, products }, kpi: kpi,
      acc: acc, show: show, measureRef: this.measureRef,
      exp: Object.fromEntries(["growth", "markets", "regions", "subcats", "bands", "segments", "ship", "customers", "products"].map((k) => [k, !!st.exp[k]])),
      tg: Object.fromEntries(["growth", "markets", "regions", "subcats", "bands", "segments", "ship", "customers", "products"].map((k) => [k, () => this.setState((s) => ({ exp: Object.assign({}, s.exp, { [k]: !s.exp[k] }), hov: null }))])),
      lab: Object.fromEntries(["growth", "markets", "regions", "subcats", "bands", "segments", "ship", "customers", "products"].map((k) => [k, st.exp[k] ? 'Hide chart' : 'Show chart'])),
      rot: Object.fromEntries(["growth", "markets", "regions", "subcats", "bands", "segments", "ship", "customers", "products"].map((k) => [k, st.exp[k] ? 'rotate(180deg)' : 'none'])) };
  }
}
