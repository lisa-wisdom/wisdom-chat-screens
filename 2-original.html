.wc-bar{animation:wcGrowX 520ms cubic-bezier(0.2,0.7,0.2,1) both;transition:background-color 120ms}
.wc-col{animation:wcGrowY 520ms cubic-bezier(0.2,0.7,0.2,1) both;transition:background-color 120ms}
.wc-draw{animation:wcFade 520ms ease-out both}
.wc-fade{animation:wcFade 520ms ease-out both}
.wc-dot{transition:opacity 120ms,width 120ms,height 120ms,left 120ms,top 120ms}
@keyframes wcGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wcGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wcDraw{to{stroke-dashoffset:0}}
@keyframes wcFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.wc-bar,.wc-col{animation:wcFade 200ms both}.wc-draw{animation:none}}
.wc-hit:focus-visible,.wc-dot:focus-visible{outline:2px solid #544AEF;outline-offset:-2px}
.wc-ghost:hover{background:#F2F4F9 !important}
.wc-nav:hover{background:#EEF0F5}
.wc-link:hover{background:#EDEBFE !important}
.wc-src:hover{color:#544AEF !important}
.wc-fol:hover{text-decoration-color:#544AEF !important}
button:focus-visible,a:focus-visible{outline:2px solid #544AEF;outline-offset:2px}
@media (max-width: 760px){.wc-side-extra{display:none !important}}
</style>

<a href="https://canary.gowisdom.ai/chat/340c50d7-ab62-44c2-b342-5f12225092bc" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 4px; color: #544AEF; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere">canary.gowisdom.ai/chat/340c50d7-ab62-44c2-b342-5f12225092bc<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a>
</div>
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #F2F4F9; flex-wrap: wrap">
<button type="button" class="wc-ghost" style="display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; font: 500 13.5px Inter, 'Avenir Next LT Pro', system-ui, sans-serif; color: #1E2746; padding: 4px 6px; border-radius: 6px">Descriptive business insights in charts<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display: flex; gap: 4px; color: #4A5578"><button type="button" class="wc-ghost" aria-label="About this chat" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></button><button type="button" class="wc-ghost" aria-label="Share chat" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.59 13.51 6.83 3.98"></path><path d="m15.41 6.51-6.82 3.98"></path></svg></button></div>
</header>

<div style="width: 100%; max-width: 784px; margin: 0 auto; box-sizing: border-box; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: flex-end"><div style="max-width: 80%; background: #F2F4F9; border-radius: 16px; padding: 10px 16px; font-size: 13.5px; line-height: 1.5; color: #0B1020">i want a set of descriptive insights about this business, in charts</div></div>

<div ref="{{measureRef}}" style="display: flex; flex-direction: column; gap: 24px">
<sc-for list="{{charts}}" as="ch" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B7699"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>{{ch.step}}</div>
<section id="{{ch.id}}" aria-label="{{ch.title}}" style="background: #FFFFFF; border: 1px solid #E4E8F2; border-radius: 8px">
<div style="padding: 20px 20px 18px">
<h3 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: #0B1020">{{ch.title}}</h3>
<div style="margin-top: 4px; font-size: 13px; line-height: 18px; color: #4A5578">{{ch.sub}}</div>
<sc-if value="{{ch.chartOn}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{ch.isCombo}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin: 18px 0 16px; font-size: 12.5px; color: #1E2746">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #1B66C4"></span>{{ch.l1}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 2px; border-radius: 1px; background: #C3408B"></span>{{ch.l2}}</span>
</div>
<div style="position: relative; height: {{ch.p.h}}px; font-size: 12px">
<sc-for list="{{ch.p.grid}}" as="g" hint-placeholder-count="6"><div style="position: absolute; left: 0; right: 0; top: {{g.y}}px; height: 1px; background-image: repeating-linear-gradient(to right, #DBDFE9 0 1px, transparent 1px 4px)"></div><div style="position: absolute; left: 0; top: {{g.ly}}px; line-height: 14px; color: #6B6B6B; white-space: pre">{{g.l}}</div><div style="position: absolute; right: 0; top: {{g.ly}}px; line-height: 14px; color: #6B6B6B; white-space: pre; text-align: right">{{g.r}}</div></sc-for>
<sc-for list="{{ch.p.cols}}" as="k" hint-placeholder-count="12"><div class="wc-col" style="position: absolute; left: {{k.x}}px; top: {{k.y}}px; width: {{k.w}}px; height: {{k.h}}px; background: #1B66C4; opacity: {{k.op}}; transform-origin: center bottom"></div></sc-for>
<div style="position: absolute; left: {{ch.p.mL}}px; right: {{ch.p.mR}}px; top: {{ch.p.base}}px; height: 1px; background: #787E8A"></div>
<sc-if value="{{ch.p.ref}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: {{ch.p.mL}}px; right: {{ch.p.mR}}px; top: {{ch.p.ref.y}}px; height: 1px; background-image: repeating-linear-gradient(to right, #262626 0 4px, transparent 4px 8px); z-index: 1"></div><div style="position: absolute; right: {{ch.p.mR}}px; top: {{ch.p.ref.ly}}px; font-size: 12px; line-height: 14px; font-weight: 500; color: #262626; white-space: nowrap; z-index: 1">{{ch.p.ref.label}}</div></sc-if>
<svg dc-width="{{ch.p.w}}" dc-height="{{ch.p.h}}" dc-viewBox="{{ch.p.vb}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; z-index: 2"><path class="wc-draw" dc-d="{{ch.p.line}}" fill="none" stroke="#C3408B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<sc-for list="{{ch.p.xl}}" as="x" hint-placeholder-count="6"><div style="position: absolute; left: {{x.x}}px; top: {{ch.p.base}}px; width: 1px; height: 5px; background: #787E8A"></div><div style="position: absolute; left: {{x.x}}px; top: {{ch.p.labY}}px; transform: translateX(-50%); text-align: center; line-height: 15px; color: #6B6B6B; white-space: pre">{{x.t}}</div></sc-for>
<sc-if value="{{ch.p.dot}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: {{ch.p.dot.x}}px; top: {{ch.p.dot.y}}px; width: 10px; height: 10px; margin: -5px 0 0 -5px; box-sizing: border-box; border-radius: 50%; background: #C3408B; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #C3408B; z-index: 3; pointer-events: none"></div></sc-if>
<sc-for list="{{ch.p.hits}}" as="hh" hint-placeholder-count="12"><button type="button" class="wc-hit" aria-label="{{hh.aria}}" onMouseEnter="{{hh.enter}}" onMouseLeave="{{hh.leave}}" onFocus="{{hh.enter}}" onBlur="{{hh.leave}}" style="position: absolute; left: {{hh.x}}px; top: {{ch.p.mT}}px; width: {{hh.w}}px; height: {{ch.p.plotH}}px; background: transparent; border: 0; padding: 0; margin: 0; cursor: crosshair; z-index: 4"></button></sc-for>
<sc-if value="{{ch.p.tip}}" hint-placeholder-val="{{ false }}">

<div style="font-size: 13px; color: #6B7699">Key findings</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<article style="background: #FFFFFF; border: 1px solid #E4E8F2; border-radius: 8px; padding: 20px">
<h3 style="margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #0B1020">Growth is strongly seasonal</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #1E2746; max-width: 68ch">Monthly sales rise materially across 2012-2015, with the largest months concentrated late in the year. Margin is more variable than sales, so higher volume does not consistently translate into a higher return on sales.</p>
<div style="display: flex; margin-top: 14px"><a href="#ch-monthly" class="wc-src" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7699; text-decoration: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>Monthly sales and margin</a></div>
</article>
<article style="background: #FFFFFF; border: 1px solid #E4E8F2; border-radius: 8px; padding: 20px">
<h3 style="margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #0B1020">Market scale and profitability do not align perfectly</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #1E2746; max-width: 68ch">Asia Pacific generated about $4.04M in sales at a 9.97% margin, while Europe generated about $3.29M at a 13.68% margin. Europe therefore provides a stronger profitability profile despite lower sales.</p>
<div style="display: flex; margin-top: 14px"><a href="#ch-markets" class="wc-src" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7699; text-decoration: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>Market performance</a></div>
</article>
<article style="background: #FFFFFF; border: 1px solid #E4E8F2; border-radius: 8px; padding: 20px">
<h3 style="margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #0B1020">Technology is a major profit engine, while Tables destroy value</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #1E2746; max-width: 68ch">Copiers contributed about $258.6K of profit, Phones $216.7K, and Accessories $129.6K. Tables lost about $64.1K on $757.0K of sales, making that sub-category an obvious candidate for pricing, discount, and cost review.</p>
<div style="display: flex; margin-top: 14px"><a href="#ch-subcats" class="wc-src" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7699; text-decoration: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>Sub-category economics</a></div>
</article>
<article style="background: #FFFFFF; border: 1px solid #E4E8F2; border-radius: 8px; padding: 20px">
<h3 style="margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #0B1020">Deep discounting is the clearest profitability risk</h3>
<p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #1E2746; max-width: 68ch">Margin declines from 25.32% with no discount to 9.86% at discounts above 10% through 20%, then turns negative above 20%. Discounts above 40% produced an approximately -74.13% margin and a $627.4K aggregate loss.</p>
<div style="display: flex; margin-top: 14px"><a href="#ch-bands" class="wc-src" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B7699; text-decoration: none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>Discount-band performance</a></div>
</article>
</div>
<div style="background: #F7F8FA; border-radius: 8px; padding: 16px 20px; margin-top: 8px">
<div style="font-size: 12.5px; font-weight: 500; color: #4A5578; margin-bottom: 4px">Scope and assumption</div>
<p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4A5578; max-width: 72ch">The analysis uses the full available order history, covering calendar years 2012-2015. Profit margin is assumed to be <code style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #1E2746">sum(Profit) / sum(Sales)</code>; no separately governed margin definition was available.</p>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script type="text/x-dc">
class Component extends DCLogic {
  state = { cw: 736, hov: null, tables: {} };
  BLUE = '#1B66C4';
  PINK = '#C3408B';
  RED = '#E04243';
  MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  /* Monthly total sales (USD) and profit margin (%), Jan 2012 – Dec 2015 */
  MS = [98898.49, 103717.92, 135746.40, 114332.96, 158228.33, 207571.54, 118434.88, 208063.28, 284587.75, 216114.57, 293947.35, 319807.41,
    137435.98, 98854.96, 163076.77, 161052.27, 208364.89, 256175.70, 145236.79, 303142.94, 289389.17, 252939.85, 323512.42, 338256.97,
    199185.91, 167239.65, 198594.03, 177821.32, 260498.56, 396519.61, 229928.95, 326488.79, 376619.25, 293406.64, 373989.36, 405454.38,
    241268.56, 184837.36, 263100.77, 242771.86, 288401.05, 401814.06, 258705.68, 456619.94, 481157.24, 422766.63, 555279.03, 503143.69];
  MM = [8.41, 13.81, 9.64, 11.55, 9.26, 10.09, 3.41, 12.71, 12.31, 12.77, 11.31, 11.89,
    7.50, 15.27, 11.03, 10.78, 14.34, 13.43, 10.73, 14.37, 9.60, 12.12, 9.84, 9.74,
    13.46, 14.21, 11.80, 10.94, 10.94, 11.47, 12.55, 9.50, 10.33, 14.46, 12.85, 12.38,
    11.61, 10.69, 14.20, 9.80, 11.77, 10.90, 10.84, 11.73, 14.13, 13.77, 11.32, 9.32];
  MARKETS = [['Asia Pacific', 4042658.27, 9.97], ['Europe', 3287336.23, 13.68], ['USCA', 2364129.03, 12.87], ['LATAM', 2164605.17, 10.24], ['Africa', 783773.21, 11.34]];
  SUBCATS = [['Copiers', 'Technology', 258567.55], ['Phones', 'Technology', 216717.01], ['Bookcases', 'Furniture', 161924.42], ['Appliances', 'Office Supplies', 141562.59],
    ['Chairs', 'Furniture', 140396.27], ['Accessories', 'Technology', 129626.31], ['Storage', 'Office Supplies', 108416.68], ['Binders', 'Office Supplies', 72433.15],
    ['Machines', 'Technology', 58867.87], ['Paper', 'Office Supplies', 58111.65], ['Art', 'Office Supplies', 57829.86], ['Furnishings', 'Furniture', 46845.43],
    ['Envelopes', 'Office Supplies', 28849.49], ['Supplies', 'Office Supplies', 22559.20], ['Labels', 'Office Supplies', 14988.92], ['Fasteners', 'Office Supplies', 13844.29],
    ['Tables', 'Furniture', -64083.39]];
  BANDS = [['No discount', 'No discount', 6992410.95, 25.32], ['>0% through 10%', '>0–10%', 1962618.85, 17.23], ['>10% through 20%', '>10–20%', 1757261.34, 9.86],
    ['>20% through 30%', '>20–30%', 382554.69, -5.53], ['>30% through 40%', '>30–40%', 701343.12, -23.69], ['>40%', '>40%', 846312.97, -74.13]];

  setHov = (k) => { if (this.state.hov !== k) this.setState({ hov: k }); };
  clearHov = () => { if (this.state.hov != null) this.setState({ hov: null }); };
  measureRef = (el) => {
    if (el === this._el) return;
    if (this._ro) { this._ro.disconnect(); this._ro = null; }
    this._el = el;
    if (el && typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver((es) => {
        const w = Math.floor(es[0].contentRect.width);
        if (w > 0 && Math.abs(w - this.state.cw) > 1) this.setState({ cw: w });
      });
      this._ro.observe(el);
    }
  };
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); }

  r1(v) { return Math.round(v * 10) / 10; }
  tw(s, fs) { return String(s).length * (fs || 12) * 0.58; }
  money(v) {
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return s + '$' + (a / 1e3).toFixed(1) + 'K';
    return s + '$' + a.toFixed(0);
  }
  full(v) { return (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  axMoney(v) {
    if (v === 0) return '$0';
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e6) return s + '$' + (+(a / 1e6).toFixed(1)) + 'M';
    return s + '$' + Math.round(a / 1e3) + 'K';
  }
  pct(v, dp) { return (v < 0 ? '−' : '') + Math.abs(v).toFixed(dp == null ? 1 : dp) + '%'; }

  tip(x, y, w, title, lines) {
    const tw = Math.round(Math.max(170, Math.min(280, Math.max(this.tw(title, 12.5), ...lines.map((l) => this.tw(l.k + l.v, 12) + 34)) + 28)));
    const th = 34 + lines.length * 18;
    let left = x + 14;
    if (left + tw > w) left = x - 14 - tw;
    if (left < 0) left = Math.max(0, Math.min(w - tw, x - tw / 2));
    return { left: Math.round(left), top: Math.round(Math.max(-8, y - th / 2)), w: tw, title: title,
      lines: lines.map((l) => ({ k: l.k, v: l.v, c: l.c || 'transparent', sw: l.line ? 12 : 8, sh: l.line ? 2 : 8 })) };
  }

  /* Combo: columns on the left axis, a 2px line on the right axis, shared gridlines. */
  combo(key, s, w) {
    const hov = this.state.hov, hi = hov && hov.indexOf(key + ':') === 0 ? +hov.split(':')[1] : null;
    const h = s.h || 300, mL = 48, mR = 46, mT = 24, mB = s.mB || 40;
    const plotW = w - mL - mR, plotH = h - mT - mB, n = s.cats.length, band = plotW / n;
    const cw = Math.min(band * 0.8, s.maxCol || 56);
    const k = s.lt.length - 1;
    const yAt = (i) => mT + (1 - i / k) * plotH;
    const YL = (v) => mT + (1 - (v - s.lt[0]) / (s.lt[k] - s.lt[0])) * plotH;
    const YR = (v) => mT + (1 - (v - s.rt[0]) / (s.rt[k] - s.rt[0])) * plotH;
    const grid = s.lt.map((t, i) => ({ y: this.r1(yAt(i)), ly: this.r1(yAt(i) - 18),
      l: s.lf(t) + (i === k ? '   ' + s.lu : ''), r: (i === k ? s.ru + '   ' : '') + s.rf(s.rt[i]) }));
    const base = YL(0);
    const cx = (i) => mL + i * band + band / 2;
    const cols = s.cats.map((c, i) => {
      const y = YL(c.a);
      return { x: this.r1(cx(i) - cw / 2), w: this.r1(cw), y: this.r1(y), h: this.r1(Math.max(base - y, 1)), op: hi == null || hi === i ? 1 : 0.45 };
    });
    const line = s.cats.map((c, i) => (i ? 'L' : 'M') + this.r1(cx(i)) + ' ' + this.r1(YR(c.b))).join(' ');
    const xl = [];
    s.cats.forEach((c, i) => { if (c.x) xl.push({ x: this.r1(cx(i)), t: c.x }); });
    const hits = s.cats.map((c, i) => ({ x: this.r1(mL + i * band), w: this.r1(band), aria: c.tt + ': ' + s.l1 + ' ' + this.full(c.a) + ', ' + s.l2 + ' ' + this.pct(c.b),
      enter: () => this.setHov(key + ':' + i), leave: this.clearHov }));
    const out = { w: w, h: h, vb: '0 0 ' + w + ' ' + h, mL: mL, mR: mR, mT: mT, plotH: plotH, base: this.r1(base), labY: this.r1(base + 9),
      grid: grid, cols: cols, line: line, xl: xl, hits: hits, ref: null, dot: null, tip: null };
    if (s.ref != null) { const ry = YR(s.ref); out.ref = { y: this.r1(ry), ly: this.r1(ry - 18), label: s.refLabel }; }
    if (hi != null) {
      const c = s.cats[hi], dx = cx(hi), dy = YR(c.b);
      out.dot = { x: this.r1(dx), y: this.r1(dy) };
      out.tip = this.tip(dx + band / 2, Math.min(dy, YL(c.a)) + 20, w, c.tt, [
        { k: s.l1, v: this.money(c.a), c: this.BLUE }, { k: s.l2, v: this.pct(c.b), c: this.PINK, line: true }]);
    }
    return out;
  }

  /* Horizontal bars with a zero line, values at the bar end. */
  hbar(key, rows, w) {
    const hov = this.state.hov, hi = hov && hov.indexOf(key + ':') === 0 ? +hov.split(':')[1] : null;
    const rowH = 28, barH = 18, top = 24, labW = Math.min(Math.round(w * 0.4), 210), valPad = 64;
    const mn = -100000, mx = 300000, ticks = [-100000, 0, 100000, 200000, 300000];
    const x0 = labW + 52, x1 = w - valPad;
    const X = (v) => x0 + (v - mn) / (mx - mn) * (x1 - x0);
    const zx = X(0), plotH = rows.length * rowH;
    const out = { h: top + plotH + 30, top: top, plotH: plotH, tickY: top + plotH + 10, rowH: rowH, barH: barH, labW: labW, zx: this.r1(zx),
      vg: ticks.map((t) => ({ x: this.r1(X(t)), t: this.axMoney(t) })), tip: null,
      rows: rows.map((r, i) => {
        const neg = r.v < 0, xv = X(r.v), y = top + i * rowH;
        return { y: y, by: this.r1(y + (rowH - barH) / 2), lw: labW - 8, label: r.label,
          bx: this.r1(Math.min(xv, zx)), bw: this.r1(Math.max(Math.abs(xv - zx), 1)), fill: neg ? this.RED : this.BLUE,
          op: hi == null || hi === i ? 1 : 0.45, origin: neg ? 'right center' : 'left center',
          vx: this.r1(neg ? xv - 6 : xv + 6), vtf: neg ? 'translateX(-100%)' : 'none', vt: this.money(r.v),
          aria: r.label + ': profit ' + this.full(r.v), enter: () => this.setHov(key + ':' + i), leave: this.clearHov };
      }) };
    if (hi != null) {
      const r = rows[hi];
      out.tip = this.tip(Math.max(X(r.v), zx), top + hi * rowH + rowH / 2, w, r.label, [
        { k: 'Total profit', v: this.full(r.v), c: r.v < 0 ? this.RED : this.BLUE }]);
    }
    return out;
  }

  table(cols, rows) {
    return { gtc: 'minmax(140px, 2fr) repeat(' + (cols.length - 1) + ', minmax(96px, 1fr))',
      head: cols.map((c, i) => ({ t: c, al: i ? 'right' : 'left' })),
      rows: rows.map((r) => ({ cells: r.map((c, i) => ({ t: c, al: i ? 'right' : 'left' })) })) };
  }

  frame(id, meta, plot, tbl) {
    const on = !!this.state.tables[id];
    return Object.assign({ id: 'ch-' + id }, meta, { p: plot, tbl: tbl, tableOn: on, chartOn: !on,
      trackC: on ? '#544AEF' : '#C9CFDD', knobX: on ? 14 : 2,
      toggle: () => this.setState((s) => ({ tables: Object.assign({}, s.tables, { [id]: !s.tables[id] }), hov: null })) });
  }

  renderVals() {
    const w = Math.max(300, (this.state.cw || 736) - 42);
    const M = this.MONTHS;

    const monthly = this.MS.map((a, i) => {
      const mo = i % 12, yr = 2012 + Math.floor(i / 12);
      return { a: a, b: this.MM[i], tt: M[mo] + ' ' + yr, x: mo === 0 ? 'Jan\n' + yr : (mo === 6 ? 'Jul' : '') };
    });
    const c1 = this.frame('monthly', { step: 'Charted monthly sales and margin', title: 'Monthly Sales and Margin', sub: 'Monthly · 2012–2015 · sales in USD, profit margin %',
      l1: 'Total Sales', l2: 'Profit Margin', isCombo: true, isBar: false },
      this.combo('monthly', { cats: monthly, lt: [0, 120000, 240000, 360000, 480000, 600000], rt: [0, 4, 8, 12, 16, 20],
        lf: (t) => this.axMoney(t), rf: (t) => t + '%', lu: 'Total Sales', ru: 'Profit Margin', l1: 'Total Sales', l2: 'Profit Margin', mB: 44 }, w),
      this.table(['Month', 'Total Sales', 'Profit Margin'], monthly.map((c) => [c.tt, this.full(c.a), this.pct(c.b)])));

    const mk = this.MARKETS.map((r) => ({ a: r[1], b: r[2], tt: r[0], x: r[0] }));
    const c2 = this.frame('markets', { step: 'Charted market performance by sales', title: 'Market Performance', sub: 'Total sales and profit margin by market',
      l1: 'Total Sales', l2: 'Profit Margin', isCombo: true, isBar: false },
      this.combo('markets', { cats: mk, lt: [0, 1e6, 2e6, 3e6, 4e6, 5e6], rt: [0, 3, 6, 9, 12, 15],
        lf: (t) => this.axMoney(t), rf: (t) => t + '%', lu: 'Total Sales', ru: 'Profit Margin', l1: 'Total Sales', l2: 'Profit Margin', maxCol: 52 }, w),
      this.table(['Market', 'Total Sales', 'Profit Margin'], mk.map((c) => [c.tt, this.full(c.a), this.pct(c.b)])));

    const sc = this.SUBCATS.map((r) => ({ label: r[0] + ' (' + r[1] + ')', v: r[2] }));
    const c3 = this.frame('subcats', { step: 'Charted profit by sub category', title: 'Profit by Sub-Category', sub: 'Total profit across all categories (USD)',
      isCombo: false, isBar: true },
      this.hbar('subcats', sc, w),
      this.table(['Sub-Category', 'Total Profit'], sc.map((r) => [r.label, this.full(r.v)])));

    const bd = this.BANDS.map((r) => ({ a: r[2], b: r[3], tt: 'Discount ' + r[0], x: r[1] }));
    const c4 = this.frame('bands', { step: 'Charted discount impact by band', title: 'Discount Impact', sub: 'Sales volume and profit margin across discount bands',
      l1: 'Sales', l2: 'Profit Margin', isCombo: true, isBar: false },
      this.combo('bands', { cats: bd, lt: [0, 1.5e6, 3e6, 4.5e6, 6e6, 7.5e6], rt: [-90, -60, -30, 0, 30, 60],
        lf: (t) => this.axMoney(t), rf: (t) => this.pct(t, 0), lu: 'Sales', ru: 'Profit Margin', l1: 'Sales', l2: 'Profit Margin', maxCol: 52,
        ref: 0, refLabel: '0% breakeven' }, w),
      this.table(['Discount Band', 'Sales', 'Profit Margin'], this.BANDS.map((r) => [r[0], this.full(r[2]), this.pct(r[3], 2)])));

    return { charts: [c1, c2, c3, c4], measureRef: this.measureRef };
  }
}
